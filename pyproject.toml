[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "mydba-tui"
version = "0.1.0"
description = "A keyboard-driven terminal MySQL database administration tool"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.md" }

authors = [
    { name = "mydba-tui contributors" }
]

keywords = [
    "mysql",
    "database",
    "dba",
    "terminal",
    "tui",
    "textual",
    "administration"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: System :: Systems Administration"
]


dependencies = [
    "textual[syntax]>=0.80.0",
    "rich>=13.7.0",
    "mysql-connector-python>=9.0.0",
    "pyyaml>=6.0",
    "paramiko>=3.0.0",
    "sqlglot>=26.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]


[project.scripts]
mydba = "mydba_tui.__main__:main"


[project.urls]
Homepage = "https://github.com/mydba-tui/mydba-tui"
Repository = "https://github.com/mydba-tui/mydba-tui"
Issues = "https://github.com/mydba-tui/mydba-tui/issues"


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
mydba_tui = ["sql/**/*.sql"]


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]


[tool.ruff.lint.isort]
known-first-party = ["mydba_tui"]


[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
exclude = [
    "tests/"
]

[[tool.mypy.overrides]]
module = "paramiko"
ignore_missing_imports = true
